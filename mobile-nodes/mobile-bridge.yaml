apiVersion: v1
kind: Service
metadata:
  name: mobile-scout
  namespace: agent-execution
  labels:
    agent-role: scout
    device-type: mobile
spec:
  ports:
    - name: ssh
      port: 8022
      targetPort: 8022
    - name: ollama
      port: 11434
      targetPort: 11434
  # Removed ClusterIP: None
---
apiVersion: v1
kind: Endpoints
metadata:
  name: mobile-scout
  namespace: agent-execution
subsets:
  - addresses:
      - ip: 192.168.4.53
    ports:
      - name: ssh
        port: 8022
      - name: ollama
        port: 11434
