apiVersion: v1
kind: Pod
metadata:
  name: debug-agent
  namespace: agent-execution
  labels:
    app: debug-agent
spec:
  containers:
  - name: debug-agent
    image: debug-agent:ssh
    imagePullPolicy: IfNotPresent
    command: ["sleep", "infinity"]
    volumeMounts:
    - name: ssh-key
      mountPath: /root/.ssh/
      readOnly: true
  volumes:
  - name: ssh-key
    secret:
      secretName: scout-s10e-ssh-key
      defaultMode: 0400
      items:
      - key: id_mobile_scout-s10e
        path: id_rsa
