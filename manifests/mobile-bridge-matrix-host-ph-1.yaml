apiVersion: v1
kind: Service
metadata:
  name: matrix-host-ph-1
  namespace: agent-execution
  labels:
    agent-role: matrix-host
    device-id: ph-1
    device-type: mobile
spec:
  ports:
    - name: ssh
      port: 8022
      targetPort: 8022
    - name: ollama
      port: 11434
      targetPort: 11434
---
apiVersion: v1
kind: Endpoints
metadata:
  name: matrix-host-ph-1
  namespace: agent-execution
subsets:
  - addresses:
      - ip: 192.168.4.58
    ports:
      - name: ssh
        port: 8022
      - name: ollama
        port: 11434
