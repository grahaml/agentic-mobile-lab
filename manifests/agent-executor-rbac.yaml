apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-executor-sa
  namespace: agent-execution
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-reader
  namespace: agent-execution
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-executor-binding
  namespace: agent-execution
subjects:
- kind: ServiceAccount
  name: agent-executor-sa
  namespace: agent-execution
roleRef:
  kind: Role
  name: secret-reader
  apiGroup: rbac.authorization.k8s.io
