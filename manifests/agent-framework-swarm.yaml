apiVersion: apps/v1
kind: Deployment
metadata:
  name: internal-mcp
  namespace: agent-execution
spec:
  replicas: 1
  selector:
    matchLabels:
      app: internal-mcp
  template:
    metadata:
      labels:
        app: internal-mcp
    spec:
      containers:
      - name: internal-mcp
        image: agent-framework:latest
        imagePullPolicy: Never # Using local build
        command: ["mcp", "run", "internal_mcp.py", "--transport", "sse"]
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: internal-mcp
  namespace: agent-execution
spec:
  selector:
    app: internal-mcp
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-orchestrator
  namespace: agent-execution
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-orchestrator
  template:
    metadata:
      labels:
        app: agent-orchestrator
    spec:
      containers:
      - name: orchestrator
        image: agent-framework:latest
        imagePullPolicy: Never
        command: ["python", "orchestrator.py"]
        env:
        - name: INTERNAL_MCP_URL
          value: "http://internal-mcp:8000/sse"
        - name: OLLAMA_URL
          value: "http://ollama-service.ollama-system.svc.cluster.local:11434/api/chat"
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: agent-orchestrator
  namespace: agent-execution
spec:
  selector:
    app: agent-orchestrator
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-mcp
  namespace: agent-execution
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-mcp
  template:
    metadata:
      labels:
        app: gateway-mcp
    spec:
      containers:
      - name: gateway-mcp
        image: agent-framework:latest
        imagePullPolicy: Never
        command: ["mcp", "run", "gateway_mcp.py", "--transport", "sse"]
        env:
        - name: ORCHESTRATOR_URL
          value: "http://agent-orchestrator:8000/workflow/security-scan"
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-mcp
  namespace: agent-execution
spec:
  type: LoadBalancer # Exposed for external Aider/Claude Code
  selector:
    app: gateway-mcp
  ports:
  - port: 8001
    targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal-agent-framework
  namespace: agent-execution
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  # 1. Allow DNS (Critical for service discovery)
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # 2. Allow Egress within the agent-execution namespace
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: agent-execution
  # 3. Allow Egress to the ollama-system namespace
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ollama-system
