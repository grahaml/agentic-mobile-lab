apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: agent-execution
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  # 1. Allow internal Cluster traffic (DNS and Services)
  - to:
    - ipBlock:
        cidr: 10.43.0.0/16
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
    - protocol: TCP
      port: 11434
    - protocol: TCP
      port: 8022
  # 2. Allow Traffic to Mobile Node (LAN)
  - to:
    - ipBlock:
        cidr: 192.168.4.53/32
  # 3. Allow Traffic to pods in ollama-system namespace
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ollama-system
